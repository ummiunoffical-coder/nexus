<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem 1.25rem;
    background:
      radial-gradient(1100px 520px at 78% -10%,rgba(180,92,255,.20),transparent 60%),
      radial-gradient(900px 500px at 8% 108%,rgba(46,230,255,.14),transparent 60%),
      linear-gradient(180deg,#05081a 0%,#04060f 78%);
    background-color:#04060f;color:#eaf4ff;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
  }
  a:focus-visible{outline:2px solid #2ee6ff;outline-offset:3px;border-radius:6px}
  .wordmark{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;color:#eaf4ff}
  .wordmark-mark{
    display:grid;place-items:center;width:38px;height:38px;border-radius:10px;
    font-weight:900;font-size:1.25rem;color:#031018;
    background:linear-gradient(135deg,#2ee6ff,#b45cff);
    box-shadow:0 0 18px rgba(46,230,255,.55);
  }
  .wordmark-text{font-weight:800;letter-spacing:.34em;font-size:1.05rem}
  .code{
    margin-top:2.6rem;font-size:clamp(5rem,22vw,10rem);font-weight:900;line-height:1;letter-spacing:.02em;
    background:linear-gradient(92deg,#2ee6ff 5%,#b45cff 52%,#ff4fd8 98%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(180,92,255,.45));
  }
  .line{margin-top:1.1rem;font-size:clamp(1.05rem,2.6vw,1.3rem);color:#9db4d4;max-width:44ch}
  .btn{
    display:inline-block;margin-top:2.2rem;text-decoration:none;cursor:pointer;
    font-weight:800;letter-spacing:.14em;font-size:.9rem;color:#03141c;
    padding:.95rem 1.7rem;border-radius:12px;border:1px solid transparent;
    background:linear-gradient(92deg,#2ee6ff,#57b7ff);
    box-shadow:0 0 22px rgba(46,230,255,.45),inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .btn:hover{box-shadow:0 0 34px rgba(46,230,255,.75)}
  .credit{margin-top:3rem;font-size:.85rem;color:#9db4d4}
</style>

  <a class="wordmark" href="https://ummiunoffical-coder.github.io/nexus/" aria-label="NEXUS home">
